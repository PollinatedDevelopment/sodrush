async function preloadAll(){
 // every track has its own element, so nothing has to swap sources or start loading when it's time to play
 const els={run:RA,lobby:L,shop:P,boss1:BM1,boss2:BM2,minions:window.minionsAudio||null,portal:PA,dressing:DRE,king:KM};
 const keys=Object.keys(els),N=keys.length,dl=new Array(N).fill(0),dc=new Array(N).fill(0);
 // bar = 80% download + 20% "buffered and ready to play"
 const bump=()=>{loadFrac=keys.reduce((a,_,i)=>a+dl[i]*.8+dc[i]*.2,0)/N};
 // resolve once the element can play straight through (or after ms, e.g. iOS won't buffer before a tap)
 const ready=(el,ms)=>new Promise(res=>{
  if(!el||el.readyState>=4)return res();
  let done=0;const fin=()=>{if(done)return;done=1;clearTimeout(t);el.removeEventListener('canplaythrough',fin);el.removeEventListener('error',fin);res()};
  const t=setTimeout(fin,ms);el.addEventListener('canplaythrough',fin);el.addEventListener('error',fin);
 });
 const jobs=keys.map(async(k,i)=>{
  const url=AB[k],el=els[k];
  if(el)el.preload='auto';
  try{
   const r=await fetch(url);
   if(!r.ok){loadMissing.push(url.split('/').pop());if(el)el.src=url}
   else{
    const total=+r.headers.get('content-length')||0,parts=[],rd=r.body.getReader();let got=0;
    for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;dl[i]=total?Math.min(.99,got/total):0;bump()}
    const u=URL.createObjectURL(new Blob(parts,{type:'audio/mpeg'}));AB[k]=u;dl[i]=1;bump();
    if(el&&el.paused){el.src=u;el._src=u;el.load();await ready(el,4000)}
   }
  }catch(e){
   if(el){el.src=url;el.load();await ready(el,15000);if(el.error)loadMissing.push(url.split('/').pop())}
  }
  dl[i]=dc[i]=1;bump();
 });
 setTimeout(()=>{if(!loadDone){loadFrac=1;loadDone=1}},30000);
 await Promise.all(jobs);
 loadFrac=1;loadDone=1;
}

<script>
/* ===== DEVICE DETECTION: touch layout, on-screen d-pad, no page highlight ===== */
(function(){try{

// which kind of device is this?
const mm=q=>{try{return matchMedia(q).matches}catch(e){return false}};
let touch=mm('(pointer:coarse)')||(('ontouchstart' in window||navigator.maxTouchPoints>0)&&!mm('(hover:hover) and (pointer:fine)'));
const setTouch=v=>{touch=v;root.dataset.touch=v?'1':'0'};
setTouch(touch);

addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!touch)setTouch(true)},true);

pad.querySelectorAll('.k').forEach(b=>{
 const a=b.dataset.a;
 b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();try{b.setPointerCapture(e.pointerId)}catch(_){}b.classList.add('dn');buzz();if(a==='j')jump();else slide()});
 ['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,e=>{b.classList.remove('dn')}));
